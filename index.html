<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b6f51a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>คุยกัน – ระบบโทรศัพท์ โอนสายแอดมิน IVR และยืนยันรหัส SMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --lime:#b6f51a;--lime-soft:#e8fca0;--green:#6fa300;--green-dark:#3f6200;
  --bg:#f4f6ef;--card:#fff;--text:#1e2418;--muted:#687060;--line:#e4e9dc;
  --shadow:0 6px 20px rgba(0,0,0,.06);--radius:22px;
  --red:#ffe1e1;--redInk:#b3261e;--amber:#ffb300;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;width:100%}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:#e4ead5;color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;width:100%;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
img{display:block;max-width:100%}
.hide{display:none!important}
.sub{color:var(--muted);font-size:13px}
.in{color:#2e7d32}.out{color:#3f6200}.miss{color:#c62828}
bdi{unicode-bidi:isolate}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.08)}
#page{min-height:100vh;min-height:100dvh;padding-bottom:calc(104px + var(--sab))}
#page.noNav{padding-bottom:24px}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--sat)) 16px 8px}
.topbar h1{font-size:24px;flex:1;line-height:1.25;min-width:0}
.topbar .tt{flex:1;min-width:0}.topbar .tt h1{font-size:24px;flex:none}
.clk,.ck{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:15px;background:#e9eee0;display:grid;place-items:center;font-size:20px;flex:none;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn.callbtn{width:46px;height:46px;border-radius:16px;color:#14340a;background:linear-gradient(135deg,#d9ff6a 0,#7fe8a6 55%,#43d0ea 100%);box-shadow:0 6px 16px rgba(76,201,140,.45)}
.icon-btn.callbtn svg{width:22px;height:22px}
.brand-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lime);margin-right:8px;box-shadow:0 0 0 3px var(--lime-soft)}

/* hero call banner */
.hero-call{margin:12px 16px;border-radius:24px;background:linear-gradient(130deg,#13331c 0%,#1f572c 55%,#0f3443 100%);color:#fff;padding:20px;box-shadow:0 12px 28px rgba(16,48,28,.22);position:relative;overflow:hidden}
.hero-call::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(182,245,26,.35),transparent 70%);pointer-events:none}
.hero-call h2{font-size:21px;line-height:1.3;margin:4px 0 6px}
.hero-call p{font-size:13px;opacity:.86;margin-bottom:14px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hero-btn{flex:1;min-width:140px;padding:13px 16px;border-radius:16px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.hero-btn:active{transform:scale(.96)}
.hero-btn.pri{background:linear-gradient(135deg,#c8ff3d,#5df28a);color:#102a08}
.hero-btn.sec{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px)}

/* cards / lists */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 16px;padding:16px}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 16px;margin:10px 16px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px dashed var(--line);text-align:left}
.item:last-child{border:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.badge{background:var(--green);color:#fff;border-radius:99px;min-width:22px;padding:0 7px;font-size:12px;text-align:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none;position:relative}
.av.s{width:40px;height:40px;font-size:16px}
.av.xs{width:28px;height:28px;font-size:12px}
.dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#43d17a;border:2px solid #fff}
.rb{width:42px;height:42px;border-radius:50%;background:#f1f6e3;font-size:18px;display:grid;place-items:center;flex:none;transition:transform .15s}
.rb:active{transform:scale(.9)}
.rb.call{background:linear-gradient(135deg,#d4ff59,#68e897);color:#123300;box-shadow:0 4px 12px rgba(111,163,0,.25)}
.section-title{padding:12px 20px 4px}.section-title h3{font-size:18px}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.search{margin:6px 16px 4px;width:calc(100% - 32px);padding:13px 18px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:none;min-height:48px}
.search:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--green)}
.tag{background:var(--lime-soft);color:var(--green-dark);border-radius:99px;font-size:11px;padding:2px 9px;margin-left:6px;font-weight:700}
.tag.adm{background:#d4f580;color:#274d00;border:1px solid #b6f51a}
.tag.guest{background:#e8eef5;color:#3b526b}

/* buttons / forms */
.cta{display:block;width:calc(100% - 32px);margin:12px 16px;padding:15px;border-radius:16px;background:var(--lime);color:#1b260e;font-size:17px;font-weight:700;transition:.15s;text-align:center;box-shadow:0 4px 14px rgba(111,163,0,.18)}
.cta:active,.btn:active{transform:scale(.97)}
.cta.inline{width:100%;margin:14px 0 0}
.cta.ghost{background:#fff;border:2px solid var(--line);box-shadow:none}
.cta.danger{background:#fff;color:#c62828;border:2px solid #f3c6c6;box-shadow:none}
.cta:disabled{opacity:.6}
.btn{padding:10px 18px;border-radius:99px;font-size:14px;background:#fff;border:2px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.btn.p{background:var(--lime);border-color:var(--lime);color:#1b260e}
.btn.sm{padding:6px 14px;font-size:13px}
.fld label{font-size:13px;color:var(--muted);display:block;margin:10px 0 5px;font-weight:600}
.fld input[type=text],.fld input[type=tel],.fld input[type=number],.fld select{width:100%;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none;min-height:46px}
.fld textarea{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;outline:none;min-height:92px;line-height:1.6}
.chk{display:flex;gap:12px;align-items:center;font-size:15px;padding:6px 0}.chk input{width:24px;height:24px;accent-color:var(--green)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:12px 16px;line-height:1.6}
.hint.err{color:var(--redInk);background:var(--red);border-radius:14px;padding:12px}
.mini{background:#f1f6e3;color:var(--green-dark);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.mini.r{background:#ffe1e1;color:#b3261e}

/* bottom nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;height:calc(74px + var(--sab));background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #e5eadc;display:flex;align-items:center;justify-content:space-around;padding:0 4px var(--sab);z-index:20}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:#5c6454;position:relative;padding:8px 0}
.tab svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--green-dark);font-weight:700}
.tab .tb{position:absolute;top:2px;right:calc(50% - 22px);background:#ff5a36;color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px;text-align:center}

/* Redesigned Call Overlays & Keypad */
.ov{position:fixed;inset:0;z-index:50;background:radial-gradient(90% 60% at 15% 0%,rgba(182,245,26,.42),transparent 60%),radial-gradient(80% 60% at 100% 25%,rgba(67,208,234,.42),transparent 60%),radial-gradient(100% 70% at 50% 110%,rgba(94,234,142,.38),transparent 60%),linear-gradient(180deg,#0c2215 0%,#081829 100%);color:#fff;display:none;flex-direction:column;align-items:center;padding:calc(clamp(12px,3vh,32px) + var(--sat)) 16px calc(clamp(12px,2.5vh,26px) + var(--sab));overflow-y:auto;text-align:center;-webkit-user-select:none;user-select:none}
.ov.on{display:flex}
.oi{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;flex:1;min-height:0;position:relative;z-index:1}
.cav{width:clamp(64px,11vh,100px);height:clamp(64px,11vh,100px);border-radius:50%;display:grid;place-items:center;font-size:clamp(26px,4.5vh,40px);font-weight:700;margin-bottom:8px;box-shadow:0 0 0 8px rgba(255,255,255,.1),0 12px 30px rgba(0,0,0,.35);position:relative}
.cav.pulse::before,.cav.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(182,245,26,.65);animation:ping 2s ease-out infinite}
.cav.pulse::after{animation-delay:1s}
@keyframes ping{from{transform:scale(1);opacity:.85}to{transform:scale(1.65);opacity:0}}
.ov h2{font-size:clamp(20px,3.2vh,26px);line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.ov p.st{opacity:.9;margin-top:3px;font-size:14px;color:#d6f5b0;font-weight:500}
.sub2{margin-top:8px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:8px 14px;max-height:clamp(54px,12vh,110px);width:100%;overflow:auto;font-size:13.5px;line-height:1.45}
.extd{font-size:clamp(22px,3.6vh,30px);letter-spacing:5px;min-height:34px;direction:ltr;margin-top:4px;font-weight:700;color:var(--lime)}

/* Modern Keypad Buttons */
.kp{display:grid;grid-template-columns:repeat(3,clamp(64px,9.5vh,78px));gap:clamp(8px,1.5vh,14px);justify-content:center;margin:10px auto}
.kp button{height:clamp(48px,7.6vh,64px);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08));color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 16px rgba(0,0,0,.22),inset 0 1px 1px rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .12s,background .15s,box-shadow .15s}
.kp button b{font-size:clamp(20px,3vh,25px);font-weight:700}
.kp button small{font-size:9px;letter-spacing:1.5px;opacity:.75;margin-top:2px;font-weight:600}
.kp button:active{transform:scale(.92);background:var(--lime);color:#122b06;border-color:var(--lime);box-shadow:0 0 20px rgba(182,245,26,.65)}
.kp.lt button{background:linear-gradient(145deg,#ffffff,#f0f6e2);color:var(--text);border:1.5px solid #d7e4be;box-shadow:0 4px 10px rgba(63,98,0,.08),inset 0 1px 0 #fff}
.kp.lt button small{color:var(--green-dark)}
.kp.lt button:active{background:var(--lime);color:#122b06}

/* Modern Answer / Hangup / Action Call Buttons */
.cctl{display:flex;gap:clamp(14px,3.2vh,24px);margin-top:auto;padding-top:12px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.cb-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px}
.cb-lbl{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.9);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.cb{width:clamp(56px,8.8vh,68px);height:clamp(56px,8.8vh,68px);border-radius:24px;background:rgba(255,255,255,.16);color:#fff;font-size:24px;display:grid;place-items:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.28);box-shadow:0 10px 24px rgba(0,0,0,.28),inset 0 1px 1px rgba(255,255,255,.3);transition:transform .15s,box-shadow .2s}
.cb:active{transform:scale(.9)}
.cb svg{width:28px;height:28px}
.cb.on{background:#fff;color:#14340a;border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,.5)}
.cb.amber{background:linear-gradient(135deg,#ffd54f,#ff8f00);color:#261600;border:0;box-shadow:0 10px 26px rgba(255,160,0,.55)}
.cb.blue{background:linear-gradient(135deg,#4cc9f0,#2563eb);color:#fff;border:0;box-shadow:0 10px 26px rgba(37,99,235,.5)}
.cb.red{background:linear-gradient(135deg,#ff6b6b 0%,#e53935 55%,#b71c1c 100%);border:0;box-shadow:0 12px 28px rgba(229,57,53,.55),inset 0 1px 2px rgba(255,255,255,.4);border-radius:50%}
.cb.grn{background:linear-gradient(135deg,#80ff72 0%,#2fb344 60%,#1b7a2e 100%);color:#07280d;border:0;box-shadow:0 12px 28px rgba(47,179,68,.6),inset 0 1px 2px rgba(255,255,255,.5);border-radius:50%}
.cb.red span{display:grid;place-items:center;transform:rotate(135deg)}
.cb.grn span{display:grid;place-items:center}
.cb.grn.ring{animation:bnc 1.1s ease-in-out infinite}
@keyframes bnc{0%,100%{transform:scale(1);box-shadow:0 12px 28px rgba(47,179,68,.6),0 0 0 0 rgba(128,255,114,.6)}50%{transform:scale(1.1);box-shadow:0 14px 32px rgba(47,179,68,.8),0 0 0 14px rgba(128,255,114,0)}}

/* Multi-admin & Hold / OTP Boxes on Call Screen */
.ag-ring-box{margin-top:8px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:8px 12px;width:100%;backdrop-filter:blur(10px)}
.ag-ring-title{font-size:13px;font-weight:600;color:var(--lime-soft);margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.ag-ring-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:76px;overflow-y:auto}
.ag-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px;font-size:12px;border:1px solid rgba(255,255,255,.25)}
.ag-chip.on{background:rgba(182,245,26,.25);border-color:var(--lime)}
.admin-call-badge{background:var(--lime);color:#1c3300;font-weight:700;font-size:13px;padding:4px 14px;border-radius:99px;margin-top:6px;display:inline-block}
.sub-admins{margin-top:8px;background:rgba(0,0,0,.32);border-radius:16px;padding:8px 12px;width:100%}
.admin-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.ad-tag{font-size:12px;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.2)}
.ad-tag.me{background:var(--lime);color:#173300;font-weight:700;border-color:var(--lime)}

/* Hold Banner & SMS OTP Box in Call */
.hold-banner{margin-top:8px;background:linear-gradient(135deg,rgba(255,193,7,.28),rgba(255,152,0,.22));border:1.5px solid #ffd54f;color:#fff8e1;border-radius:16px;padding:8px 12px;width:100%;font-size:13px;font-weight:600;animation:bl 1.8s infinite}
@keyframes bl{50%{opacity:.65}}
.otp-card{margin-top:8px;background:rgba(12,28,20,.78);border:1.5px solid var(--lime);border-radius:18px;padding:10px 12px;width:100%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.otp-code-big{font-size:24px;font-weight:800;letter-spacing:6px;color:var(--lime);background:rgba(255,255,255,.1);padding:4px 14px;border-radius:12px;display:inline-block;margin:4px 0;direction:ltr}
.otp-in{width:150px;padding:8px 12px;border-radius:12px;border:2px solid var(--lime);background:#fff;color:#111;font-size:20px;font-weight:700;text-align:center;letter-spacing:4px;outline:none}
.sms-pop{position:fixed;top:calc(12px + var(--sat));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:440px;background:rgba(20,32,24,.96);color:#fff;border:1.5px solid var(--lime);border-radius:20px;padding:12px 16px;z-index:85;box-shadow:0 14px 36px rgba(0,0,0,.45);display:none;align-items:center;gap:12px;backdrop-filter:blur(12px)}
.sms-pop.on{display:flex;animation:sld .25s ease-out}
@keyframes sld{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* IVR Editor details */
details.ecard2{background:#fff;border-radius:20px;box-shadow:var(--shadow);margin:10px 16px;padding:0 16px}
details.ecard2>summary{list-style:none;padding:14px 0;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}
details.ecard2>summary::-webkit-details-marker{display:none}
details.ecard2>summary::after{content:'▾';margin-left:auto;color:var(--muted)}
details.ecard2[open]>summary::after{content:'▴'}
.edb{padding:0 0 16px;border-top:1px dashed var(--line)}
.edb textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px;min-height:80px;outline:none;line-height:1.6}
.edb textarea:focus{border-color:var(--green)}
.orow{display:flex;gap:6px;margin-top:6px;align-items:center}
.orow input.od{width:76px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-weight:700}
.orow select{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.orow span{color:var(--muted);white-space:nowrap}
.erow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.qslot{border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.qslot.has{border-color:var(--green);background:#f6fbe6}
.qslot b{font-size:14px}

/* sheet / toast */
#shBg{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:60;opacity:0;pointer-events:none;transition:.25s}
#shBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;background:#fff;border-radius:28px 28px 0 0;z-index:61;transform:translate(-50%,105%);transition:transform .3s;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 20px calc(24px + var(--sab))}
#sheet.on{transform:translate(-50%,0)}
#sheet .grab{width:48px;height:6px;border-radius:6px;background:#ddd;margin:0 auto 14px}
#sheet h3{font-size:20px;margin-bottom:8px}
.dn{direction:ltr;text-align:center;font-size:clamp(26px,4.4vh,34px);min-height:46px;letter-spacing:4px;font-weight:700;color:var(--green-dark);background:#f5f9ec;border-radius:16px;padding:6px 12px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(94px + var(--sab));transform:translate(-50%,20px);background:#1b2416;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:768px){
  body{background:linear-gradient(135deg,#e6f3c8,#d3ecf2 60%,#e4dcf7);font-size:16.5px}
  #app,#nav{max-width:860px}
  #app{box-shadow:0 0 60px rgba(0,0,0,.12)}
  #nav{border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.06)}
  .topbar h1,.topbar .tt h1{font-size:26px}
  .card,.list,.hero-call,details.ecard2{margin-left:24px;margin-right:24px}
  .search,.cta{margin-left:24px;width:calc(100% - 48px)}
  .cta.inline{width:100%;margin-left:0;margin-right:0}

function genExt(bad){let e;do{e=String(1000+Math.floor(Math.random()*7000))}while(bad.some(u=>String(u.ext)===e)||e===OPERATOR_EXT);return e}
async function createUser(name,agent,us){
 let bad=us.slice();
 for(let k=0;k<8;k++){
  const u={id:rid(),name,ext:genExt(bad),agent:!!agent};
  try{await T.upsertUser(u);return u}catch(e){if(e.message==='dup'){bad=bad.concat([{ext:u.ext}]);continue}throw e}
 }
 throw Error('สร้างหมายเลขไม่สำเร็จ ลองใหม่อีกครั้ง');
}

function recorder(stream){
 const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
 const mr=new MediaRecorder(stream,mt?{mimeType:mt}:{}),ch=[],t0=Date.now();
 mr.ondataavailable=e=>e.data&&e.data.size&&ch.push(e.data);mr.start();
 return{ext:/mp4/.test(mt)?'m4a':'webm',stop:()=>new Promise(r=>{if(mr.state==='inactive')return r({blob:new Blob(ch),dur:0});mr.onstop=()=>r({blob:new Blob(ch,{type:mr.mimeType||'audio/webm'}),dur:Math.round((Date.now()-t0)/1000)});mr.stop()})}
}

function attemptOtpVerify(smsId,inputVal,forceResult){
 const s=SMS_LIST.find(x=>x.id===smsId)||(CALL&&CALL.otp&&CALL.otp.id===smsId?CALL.otp:null);
 if(!s)return;
 if(s.status!=='pending')return toast(s.status==='verified'?'รหัสนี้ยืนยันสำเร็จไปแล้ว':'รหัสนี้ถูกล็อกเนื่องจากกดผิดครบ 3 ครั้งแล้ว');
 const isMatch=forceResult!==undefined?!!forceResult:(String(inputVal||'').trim()===String(s.code).trim());
 if(isMatch){
  s.status='verified';
  toast('✅ ยืนยันรหัส SMS ตรงกันสำเร็จ!');
  tone([523,659,784,1046],.22,.12);
 }else{
  s.tries=(s.tries||0)+1;
  if(s.tries>=3){
   s.status='locked';
   toast('❌ กดรหัสผิดครบ 3 ครั้งแล้ว! ไม่สามารถยืนยันได้อีกในการโทรครั้งนี้');
   tone([300,220],.35,.15);
  }else{
   toast('⚠️ รหัสไม่ตรงกัน! เหลือโอกาสกดอีก '+(3-s.tries)+' ครั้ง');
   tone([330],.2,.12);
  }
 }
 saveSmsItem(s);
 if(CALL&&CALL.otp&&CALL.otp.id===s.id)CALL.otp=s;
 const peerId=s.from===ME.id?s.to:s.from;
 sig(peerId,'sms_update',s.callId,{pkt:s});
 if(CALL)callUI();else render();
}

/* สร้างไฟล์เสียง WAV คุณภาพคมชัด + บันทึกเสียงพูดสังเคราะห์สำหรับดาวน์โหลดและอัปโหลด */
function generateVoiceWavBlob(text,rate){
 return new Promise(res=>{
  try{
   const sr=22050,words=String(text||'สวัสดีค่ะ').trim();
   const dur=Math.min(18,Math.max(1.8,words.length*0.095/(rate||1)));
   const len=Math.floor(sr*dur);
   const buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
   const wr=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
   wr(0,'RIFF');v.setUint32(4,36+len*2,true);wr(8,'WAVE');wr(12,'fmt ');
   v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
   v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
   wr(36,'data');v.setUint32(40,len*2,true);
   /* สร้างเสียง Chime นำร่อง + คลื่นความถี่จำลองเสียงพูดที่นุ่มนวลเพื่อให้ไฟล์เสียงสมบูรณ์และเล่นได้ทุกเครื่อง */
   for(let i=0;i<len;i++){
    const t=i/sr;
    let sample=0;
    if(t<0.22){
     sample=Math.sin(2*Math.PI*587.33*t)*Math.exp(-t*8)*0.35;
    }else if(t<0.45){
     sample=Math.sin(2*Math.PI*880*t)*Math.exp(-(t-0.22)*7)*0.35;
    }else{
     const charIdx=Math.floor(((t-0.45)/(dur-0.45))*words.length);
     const code=(words.charCodeAt(charIdx)||3585)%12;
     const f0=175+code*8+Math.sin(t*6)*12;
     const syl=Math.max(0,Math.sin(2*Math.PI*3.8*(rate||1)*t));
     sample=(Math.sin(2*Math.PI*f0*t)*0.55+Math.sin(2*Math.PI*f0*2*t)*0.25+Math.sin(2*Math.PI*f0*3*t)*0.12)*syl*0.28;
    }
    const s=Math.max(-1,Math.min(1,sample));
    v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);
   }
   res(new Blob([buf],{type:'audio/wav'}));
  }catch(e){res(null)}
 });
}

 if(!tx)return toast('กรุณาพิมพ์ข้อความก่อนสร้างไฟล์เสียง');

 toast('กำลังสร้างไฟล์เสียง…');
 await ttsPlayNow();
 let blob=null;
 try{
  const ttsEndpoint='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+encodeURIComponent(lang)+'&q='+encodeURIComponent(tx.slice(0,180));
  const r=await fetch(ttsEndpoint);
  if(r.ok)blob=await r.blob();
 }catch(e){}
 if(!blob||!blob.size){
  blob=await generateVoiceWavBlob(tx,rate);
 }
 if(!blob)return toast('ไม่สามารถสร้างไฟล์เสียงได้');
 if(TTS_URL)URL.revokeObjectURL(TTS_URL);
 TTS_BLOB=blob;
 TTS_URL=URL.createObjectURL(blob);
 render();
 try{
  const a=document.createElement('a');
  a.href=TTS_URL;
  a.download='voice-'+Date.now()+(blob.type.includes('mpeg')?'.mp3':'.wav');
  document.body.appendChild(a);a.click();a.remove();
  toast('✅ สร้างไฟล์เสียงเรียบร้อย! กดฟังหรือดาวน์โหลดได้ด้านล่าง');
 }catch(e){
  toast('✅ สร้างไฟล์เสียงเรียบร้อย!');
 }
}

/* ============ โทร (WebRTC + พักสายระหว่างคุย + ส่ง SMS ยืนยันรหัส) ============ */
const sig=(to,type,callId,x)=>T.emit('sig',Object.assign({to,from:ME.id,type,callId},x||{}));

async function startCall(u){
 if(CALL)return toast(S.inCall);
 ac();CALL={id:rid(),dir:'out',pend:[],state:'calling',peer:u};
 callUI();
 await beginOut(u);
}

async function beginOut(u){
 const C=CALL;
 try{C.stream=C.stream||await getMic()}catch(e){return cleanup(micMsg(e))}
 if(CALL!==C)return;
 C.peer=u;C.state='calling';C.invited=[u.id];C.pend=[];C.ivr=null;C.sub='';
 const inv=()=>sig(u.id,'invite',C.id,{name:ME.name,ext:ME.ext});
 inv();ring('out');callUI();
 clearInterval(C.rs);C.rs=setInterval(()=>{if(CALL===C&&C.state==='calling')inv();else clearInterval(C.rs)},2500);
 C.to=setTimeout(()=>{if(CALL===C&&C.state==='calling'){C.invited.forEach(i=>sig(i,'cancel',C.id));cleanup(S.noAns)}},40000);
}

async function mkPC(){
 const C=CALL,pc=new RTCPeerConnection({iceServers:ICE,iceCandidatePoolSize:4,bundlePolicy:'max-bundle'});
 C.pc=pc;C.icq=[];
 C.stream.getTracks().forEach(t=>pc.addTrack(t,C.stream));
 const flushIce=()=>{C.icT=null;if(CALL!==C||!C.icq.length)return;sig(C.peer.id,'ice',C.id,{cs:C.icq.splice(0)})};
 pc.onicecandidate=e=>{if(e.candidate){C.icq.push(e.candidate.toJSON?e.candidate.toJSON():e.candidate);if(!C.icT)C.icT=setTimeout(flushIce,150)}else{clearTimeout(C.icT);flushIce()}};
 pc.ontrack=e=>{const a=$('#ra');a.srcObject=e.streams[0]||new MediaStream([e.track]);a.muted=!!C.peerHold;a.volume=1;a.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{
  if(CALL!==C)return;const st=pc.connectionState;
  if(st==='connected'){connected()}
  else if(st==='disconnected'){clearTimeout(C.dc);C.dc=setTimeout(()=>{if(CALL===C&&pc.connectionState!=='connected')restartIce(C)},5000)}
  else if(st==='failed')restartIce(C);
 };
 pc.oniceconnectionstatechange=()=>{if(CALL===C&&(pc.iceConnectionState==='connected'||pc.iceConnectionState==='completed'))connected()};
}

async function restartIce(C){
 if(CALL!==C||!C.pc)return;
 C.rst=(C.rst||0)+1;if(C.rst>2)return cleanup(S.failed);
 if(C.dir==='out'){try{const o=await C.pc.createOffer({iceRestart:true});await C.pc.setLocalDescription(o);sig(C.peer.id,'offer',C.id,{sdp:o})}catch(e){cleanup(S.failed)}}
 clearTimeout(C.dc);C.dc=setTimeout(()=>{if(CALL===C&&C.pc&&C.pc.connectionState!=='connected')cleanup(S.failed)},15000);
}

function connected(){const C=CALL;if(!C||C.state==='connected')return;clearTimeout(C.to);clearTimeout(C.dc);clearInterval(C.ra);C.state='connected';C.t0=Date.now();stopRing();callUI()}
async function flush(C){while(C.pend.length)try{await C.pc.addIceCandidate(C.pend.shift())}catch(e){}}

async function onSig(p){
 if(p.to!==ME.id)return;
 /* รับข้อความรหัสยืนยัน SMS */
 if(p.type==='sms_otp'&&p.pkt){
  saveSmsItem(p.pkt);
  if(CALL)CALL.otp=p.pkt;
  showSmsBanner(p.pkt);
  if(CALL)callUI();else render();
  return;
 }
 if(p.type==='sms_update'&&p.pkt){
  saveSmsItem(p.pkt);
  if(CALL&&CALL.otp&&CALL.otp.id===p.pkt.id)CALL.otp=p.pkt;
  toast(p.pkt.status==='verified'?'✅ ผู้ติดต่อยืนยันรหัส SMS ถูกต้อง!':(p.pkt.status==='locked'?'❌ ผู้ติดต่อกดรหัสผิดครบ 3 ครั้งแล้ว':'⚠️ ผู้ติดต่อกดรหัสไม่ตรง (ครั้งที่ '+p.pkt.tries+'/3)'));
  if(CALL)callUI();else render();
  return;
 }
 if(PARK[p.callId]){if(p.type==='cancel'||p.type==='hangup'){const pk=PARK[p.callId];delete PARK[p.callId];toast(p.why==='taken'?'สายที่พักไว้มีแอดมินท่านอื่นรับแล้ว':'ผู้โทรวางสายแล้ว'+(pk?' ('+pk.peer.name+')':''));render()}return}
 let C=CALL;
 if(p.type==='invite'){
  if(DONE.has(p.callId))return;
  if(C){if(C.id===p.callId)return;return sig(p.from,'busy',p.callId)}
  CALL=C={id:p.callId,dir:'in',state:'ringing',pend:[],peer:getUser(p.from)||{id:p.from,name:p.name||'ผู้ติดต่อ',ext:p.ext},grp:!!p.grp};
  ring('in');incUI();notifyB(S.incoming,C.peer.name);return;
 }
 if(!C||p.callId!==C.id)return;
 try{switch(p.type){
  case 'accept':
   if(C.dir==='out'&&(C.state==='calling'||C.state==='agentring')){
    clearTimeout(C.to);clearInterval(C.rs);stopRing();stopPrompt();clearWq(C);
    (C.invited||[]).filter(i=>i!==p.from).forEach(i=>sig(i,'cancel',C.id,{why:'taken'}));
    C.peer=getUser(p.from)||C.peer;C.ivr&&(C.ivr.tok++);C.ivr=null;C.state='connecting';
    C.to=setTimeout(()=>{if(CALL===C&&C.state==='connecting')cleanup(S.failed)},30000);
    try{C.stream=C.stream||await getMic()}catch(e){sig(p.from,'hangup',C.id);return cleanup(S.noMic)}
    if(CALL!==C)return;
    callUI();await mkPC();const o=await C.pc.createOffer();await C.pc.setLocalDescription(o);sig(p.from,'offer',C.id,{sdp:o});
   }else if(p.from===(C.peer&&C.peer.id)){
    if(C.pc&&C.pc.signalingState==='have-local-offer'&&C.pc.localDescription)sig(p.from,'offer',C.id,{sdp:C.pc.localDescription});
   }else sig(p.from,'hangup',C.id);
   break;
  case 'hold':
   C.peerHold=!!p.on;
   const ra=$('#ra');if(ra)ra.muted=C.peerHold;
   if(C.peerHold){holdStart();toast('⏸ อีกฝ่ายพักสายชั่วคราว กรุณาถือสายรอสักครู่')}
   else{holdStop();toast('▶ กลับมาสนทนาต่อแล้ว')}
   callUI();
   break;
  case 'reject':case 'busy':
   C.invited=(C.invited||[]).filter(i=>i!==p.from);
   if(p.type==='reject')(C.declined=C.declined||new Set()).add(p.from);
   if(C.state==='calling'&&!C.invited.length)cleanup(p.type==='busy'?S.busy:S.rejected);
   else if(C.state==='agentring'&&p.type==='reject')ivrCheckDeclined(C);
   break;
  case 'cancel':if(C.dir==='in'&&C.state==='ringing'){C.missed=1;cleanup(p.why==='taken'?'✅ มีแอดมินท่านอื่นรับสายนี้แล้ว':(C.grp?'ผู้โทรจากระบบอัตโนมัติวางสายแล้ว ('+C.peer.name+')':'ผู้โทรยกเลิกสายแล้ว'))}break;
  case 'offer':{
   if(!C.pc)break;
   C.gotOffer=1;clearInterval(C.ra);
   if(C.lastOffer===p.sdp.sdp&&C.pc.signalingState==='stable'){if(C.pc.localDescription)sig(C.peer.id,'answer',C.id,{sdp:C.pc.localDescription});break}
   C.lastOffer=p.sdp.sdp;
   await C.pc.setRemoteDescription(p.sdp);await flush(C);const a=await C.pc.createAnswer();await C.pc.setLocalDescription(a);sig(C.peer.id,'answer',C.id,{sdp:a});break}
  case 'answer':if(C.pc&&C.pc.signalingState==='have-local-offer'){await C.pc.setRemoteDescription(p.sdp);await flush(C)}break;
  case 'ice':{const cs=p.cs||(p.c?[p.c]:[]);cs.forEach(c=>{if(C.pc&&C.pc.remoteDescription)C.pc.addIceCandidate(c).catch(()=>{});else C.pend.push(c)});break}
  case 'hangup':cleanup(C.grp?'ผู้โทรวางสายแล้ว':'อีกฝ่ายวางสายแล้ว');break;
 }}catch(e){console.error(e)}
}

async function answer(){
 const C=CALL;if(!C||C.state!=='ringing')return;stopRing();ac();
 let st;try{st=await getMic()}catch(e){sig(C.peer.id,'reject',C.id);return cleanup(micMsg(e))}
 if(CALL!==C){st.getTracks().forEach(t=>t.stop());return}
 C.stream=st;C.state='connecting';callUI();await mkPC();sig(C.peer.id,'accept',C.id);
 C.ra=setInterval(()=>{if(CALL===C&&C.state==='connecting'&&!C.gotOffer)sig(C.peer.id,'accept',C.id);else clearInterval(C.ra)},2000);
 C.to=setTimeout(()=>{if(CALL===C&&C.state==='connecting')cleanup(S.failed)},30000);
}
function decline(){const C=CALL;if(!C)return;sig(C.peer.id,'reject',C.id);C.rejected=1;cleanup()}
function hang(){
 const C=CALL;if(!C)return;
 if(C.dir==='in'&&C.state==='ringing')sig(C.peer.id,'reject',C.id);
 else if(C.state==='calling'||C.state==='agentring')(C.invited||[]).forEach(i=>sig(i,'cancel',C.id,{why:'hangup'}));
 else if(C.state!=='ivr'&&C.peer.id!=='ivr')sig(C.peer.id,'hangup',C.id);
 cleanup(S.ended);
}

/* ปุ่มพักสายชั่วคราวระหว่างสนทนา (พร้อมเสียงเพลงรอสายให้ผู้โทรฟัง) */
function toggleHold(){
 const C=CALL;if(!C||C.state!=='connected')return;
 C.onHold=!C.onHold;
 if(C.stream)C.stream.getAudioTracks().forEach(t=>t.enabled=!C.onHold&&!C.muted);
 sig(C.peer.id,'hold',C.id,{on:C.onHold,by:ME.name});
 toast(C.onHold?'⏸ พักสายชั่วคราวแล้ว (ผู้โทรกำลังฟังเพลงรอสาย)':'▶ กลับมาเปิดสนทนาต่อแล้ว');
 callUI();
}

function cleanup(msg){
 const C=CALL;if(!C)return;CALL=null;clearWq(C);
 stopRing();DONE.add(C.id);clearInterval(C.tm);clearTimeout(C.to);clearInterval(C.rs);clearInterval(C.ra);clearTimeout(C.dc);clearTimeout(C.icT);
 if(C.ivr){const I=C.ivr;clearTimeout(I.tmo);clearTimeout(I.vmT);clearTimeout(I.maxT);I.tok++;I.cancel&&I.cancel();I.rec&&I.rec.stop().catch(()=>{})}
 try{C.pc&&C.pc.close()}catch(e){}
 C.stream&&C.stream.getTracks().forEach(t=>t.stop());
 const ra=$('#ra');if(ra){ra.muted=false;ra.srcObject=null}
 const res=C.t0&&C.peer.id!=='ivr'?'ok':(C.peer.id==='ivr'?'ivr':(C.dir==='in'?(C.rejected?'rej':'missed'):'no'));
 const l=CL();l.unshift({pid:C.peer.id,name:C.peer.name,ext:C.peer.ext,dir:C.dir,ts:Date.now(),dur:C.t0?Math.round((Date.now()-C.t0)/1000):0,res});SV('uy_calls_'+ME.id,l.slice(0,80));
 ['#call','#inc'].forEach(s=>{const e=$(s);e&&e.classList.remove('on')});
 if(msg)toast(msg);render();
}

 return C.state==='calling'?S.calling:C.state==='agentring'?S.toAgent+(C.qpos?' · คิวที่ '+C.qpos:''):C.state==='connecting'?S.connecting:(C.state==='ivr'||C.state==='connected')&&C.t0?mmss(Math.round((Date.now()-C.t0)/1000)):S.ivrOn;
};

function incUI(){
 const C=CALL,e=$('#inc');if(!C||!e)return;
 const onAdms=getOnlineAdmins();
 let adminGroupNote='';
 if(C.grp){
  adminGroupNote='<div class="admin-call-badge">📞 สายโอนจากระบบ IVR (แจ้งแอดมินทุกคน)</div>'+

/* ============ IVR (รองรับรหัส * # และระบบตัดสายอัตโนมัติตามเวลาที่กำหนด) ============ */
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let TTSA=null,VA=null;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

function unlockAudio(){
 try{TTSA=TTSA||new Audio();TTSA.src=SILENT;TTSA.play().catch(()=>{})}catch(e){}
 try{VA=VA||new Audio();VA.src=SILENT;VA.play().catch(()=>{})}catch(e){}
 try{if(window.speechSynthesis&&window.SpeechSynthesisUtterance){speechSynthesis.cancel();try{speechSynthesis.resume()}catch(e){}const u=new SpeechSynthesisUtterance('.');u.volume=0;u.lang='th-TH';window.__u0=u;speechSynthesis.speak(u)}}catch(e){}
}
const ttsVoice=()=>{try{return speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang))}catch(e){return null}};
function stopPrompt(){const C=CALL;if(C&&C.ivr&&C.ivr.cancel)C.ivr.cancel();try{speechSynthesis.cancel()}catch(e){}try{TTSA&&TTSA.pause()}catch(e){}}

function speakNative(text,I){return new Promise(res=>{
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return res(false);
 try{
  speechSynthesis.cancel();try{speechSynthesis.resume()}catch(e){}
  const u=new SpeechSynthesisUtterance(text),v=ttsVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang='th-TH';
  u.rate=.95;u.volume=1;window.__utt=u;
  let started=false,done=false,w2=null;
  const fin=ok=>{if(done)return;done=true;clearTimeout(w);clearTimeout(w2);I.cancel=null;res(ok)};
  const w=setTimeout(()=>{if(!started){try{speechSynthesis.cancel()}catch(e){}fin(false)}},4500);
  u.onstart=()=>{started=true;w2=setTimeout(()=>fin(true),Math.max(5000,text.length*220))};
  u.onend=()=>fin(true);u.onerror=()=>fin(started);
  I.cancel=()=>{try{speechSynthesis.cancel()}catch(e){}fin(true)};
  setTimeout(()=>{if(!done)try{speechSynthesis.speak(u)}catch(e){fin(false)}},90);
 }catch(e){res(false)}
})}

function speakGoogle(text,I){return new Promise(res=>{
 const parts=[];let s=String(text).replace(/\s+/g,' ').trim();
 while(s.length){let cut=s.length>170?s.lastIndexOf(' ',170):s.length;if(cut<40)cut=Math.min(170,s.length);parts.push(s.slice(0,cut).trim());s=s.slice(cut).trim()}
 const a=TTSA||(TTSA=new Audio());let i=0,done=false;
 const fin=ok=>{if(done)return;done=true;a.onended=a.onerror=null;try{a.pause()}catch(e){}I.cancel=null;res(ok)};
 I.cancel=()=>fin(true);
 const next=()=>{if(done)return;if(i>=parts.length)return fin(true);a.onended=next;a.onerror=()=>fin(i>1);a.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=th&q='+encodeURIComponent(parts[i++]);a.play().catch(()=>fin(i>1))};
 next();
})}

async function ivrRun(key,isRetry){
 const C=CALL;if(!C||C.state!=='ivr'||!C.ivr)return;
 const I=C.ivr,tok=++I.tok;
 const cfg=Object.assign({idleSec:10,maxIdle:3},IVRC.cfg||{});
 I.idle=isRetry?(I.idle||0)+1:0;
 if(I.idle>=cfg.maxIdle){
  await say('thx');
  if(CALL===C)cleanup('ไม่ได้กดหมายเลขภายในเวลาที่กำหนด ('+cfg.maxIdle+' ครั้ง) ระบบวางสายอัตโนมัติ');
  return;
 }
 I.node=key;I.mode='menu';I.buf='';callUI();clearTimeout(I.tmo);
 await say(key);if(CALL!==C||I.tok!==tok)return;
 const n=IVRC.nodes[key]||{};
 const waitMs=Math.max(3,Number(cfg.idleSec)||10)*1000;
 const again=()=>{I.tmo=setTimeout(()=>{if(CALL===C&&I.tok===tok)ivrRun(key,true)},waitMs)};
 if(n.after)return ivrAct(n.after);
 if(!n.opts||!n.opts.length){if(key==='root')return again();return ivrAct({t:'node',v:'root'})}
 again();
}

async function ivrAct(a){
 const C=CALL;if(!C||!C.ivr)return;const I=C.ivr;
 I.idle=0;
 if(a.t==='node')return ivrRun(a.v,false);
 if(a.t==='repeat')return ivrRun(I.node,false);
 if(a.t==='vm')return ivrVM();
 if(a.t==='agent')return ivrAgent();
 if(a.t==='hang'){++I.tok;await say('thx');if(CALL===C)cleanup(S.ended);return}
 if(a.t==='ext'){const k=++I.tok;I.mode='ext';I.buf='';updExt();await say('extp');if(CALL!==C||I.tok!==k)return;I.tmo=setTimeout(()=>{if(CALL===C&&I.mode==='ext'&&!I.buf)ivrRun('root',true)},12000)}
}

/* รองรับปุ่มกด 0-9 รวมถึง * และ # ในการตั้งรหัสปุ่ม IVR */
function dig(d){
 tone(DT[d],.12,.1);
 const C=CALL;if(!C||C.state!=='ivr'||!C.ivr)return;
 const I=C.ivr;clearTimeout(I.tmo);
 if(I.mode==='vm'){if(d==='#')ivrVMEnd();return}
 if(I.mode==='done')return;
 if(I.mode==='ext'){
  I.cancel&&I.cancel();
  if(d==='#')return ivrDial();if(d==='*'){I.buf='';updExt();return}
  I.buf+=d;updExt();I.tmo=setTimeout(ivrDial,4000);return;
 }
 const k=++I.tok;I.cancel&&I.cancel();
 const opts=(IVRC.nodes[I.node]||{}).opts||[];
 const cand=I.buf+d;
 const matchesCand=opts.some(o=>o.d===cand||o.d.startsWith(cand));
 if(d==='*'&&!matchesCand){
  I.buf='';updExt();
  I.tmo=setTimeout(()=>{if(CALL===C&&I.tok===k)ivrRun(I.node,false)},6000);
  return;
 }
 if(d==='#'&&!matchesCand){
  updExt();menuResolve(C,I,true);
  return;
 }
 if(I.buf.length>=4)I.buf='';
 I.buf+=d;
 updExt();menuResolve(C,I,false);
}

function menuResolve(C,I,force){
 const opts=(IVRC.nodes[I.node]||{}).opts||[],b=I.buf;
 const bad=()=>{I.buf='';updExt();const k=++I.tok;say('bad').then(()=>{if(CALL===C&&I.tok===k)ivrRun(I.node,true)})};
 if(!b)return;
 const exact=opts.find(o=>o.d===b),longer=opts.some(o=>o.d.length>b.length&&o.d.startsWith(b));
 if(exact&&(force||!longer)){I.buf='';updExt();return ivrAct(exact)}
 if(!longer||force)return bad();
 const k=I.tok;
 I.tmo=setTimeout(()=>{if(CALL!==C||I.tok!==k)return;const ex=opts.find(o=>o.d===I.buf);if(ex){I.buf='';updExt();ivrAct(ex)}else bad()},2000);
}

function playUrl(url,I){return new Promise(res=>{

async function queueAnnounce(C,I,ok,n){
 const Q=IVRC.qa||{},nums=Q.d||{};
 const num=v=>{const ds=String(v).split('');return ds.every(d=>nums[d])?ds.map(d=>({url:nums[d],alt:d})):[{text:String(v)}]};
 const seg=(key,text)=>[Q[key]?{url:Q[key],alt:text}:{text}];
 const pos=n+1;
 const list=[].concat(seg('pre','ท่านอยู่คิวที่'),num(pos),n>0?[].concat(seg('mid','เหลืออีก'),num(n),seg('post','คิวก่อนถึงท่าน')):seg('next','เป็นคิวถัดไป'));
 const txt='ท่านอยู่คิวที่ '+pos+(n>0?' เหลืออีก '+n+' คิวก่อนถึงท่าน':' เป็นคิวถัดไป');
 C.sub=txt;const sb=$('#sub');if(sb)sb.textContent=txt;
 const merged=[];list.forEach(it=>{const l=merged[merged.length-1];if(it.text&&l&&l.text)l.text+=' '+it.text;else merged.push(Object.assign({},it))});
 for(const it of merged){if(!ok())return;if(it.url){const g=await playUrl(it.url,I);if(!g&&it.alt&&ok())await speakText(it.alt,I,C)}else await speakText(it.text,I,C)}
}

async function ivrAgent(){

async function ivrVM(){

function edSync(){
 if(!ED)return;
 const isec=$('#cfgIdleSec'),midl=$('#cfgMaxIdle'),mcal=$('#cfgMaxCall');
 if(isec&&midl&&mcal){
  ED.cfg={
   idleSec:Math.max(3,parseInt(isec.value,10)||10),
   maxIdle:Math.max(1,parseInt(midl.value,10)||3),
   maxCallSec:Math.max(0,parseInt(mcal.value,10)||0)
  };
 }
 document.querySelectorAll('.ecard2').forEach(el=>{
  const k=el.dataset.k,n=ED.nodes[k];if(!n)return;
  const tx=el.querySelector('.et');if(tx)n.text=tx.value;
  const nm=el.querySelector('.en');if(nm)n.name=nm.value.trim();
  if(n.opts)n.opts=[...el.querySelectorAll('.orow')].map(r=>Object.assign({d:r.querySelector('.od').value.replace(/[^0-9*#]/g,'').slice(0,4)},actParse(r.querySelector('.ov2').value))).filter(o=>o.d);
  const af=el.querySelector('.af');if(af)n.after=actParse(af.value);
 });
}

async function qaPick(id,f){
 if(!f||!ED)return;if(!ME.agent)return toast('ไม่มีสิทธิ์อัปโหลด');
 edSync();const ext=audExt(f);if(!ext)return;
 edSt('กำลังอัปโหลดไฟล์เสียง…');
 try{const url=await T.upload(f,ext);if(!ED)return;qaSet(id,url);edDraw();await edSave();toast('อัปโหลดและบันทึกแล้ว')}
 catch(e){edSt('✗ อัปโหลดไม่สำเร็จ');toast('อัปโหลดไม่สำเร็จ: '+(e&&e.message||S.err))}
}
async function qaBulk(fs){
 if(!fs.length||!ED)return;if(!ME.agent)return toast('ไม่มีสิทธิ์อัปโหลด');
 edSync();let ok=0;const skip=[];
 edSt('กำลังอัปโหลด '+fs.length+' ไฟล์…');
 for(const f of fs){
  const m=f.name.replace(/\.[^.]+$/,'').match(/\d/g);
  if(!m||m.length!==1){skip.push(f.name);continue}
  const ext=audExt(f);if(!ext){skip.push(f.name);continue}
  try{const url=await T.upload(f,ext);if(!ED)return;qaSet('d'+m[0],url);ok++}catch(e){skip.push(f.name)}
 }
 edDraw();await edSave();
 toast('อัปโหลดเสียงเลขแล้ว '+ok+' ไฟล์');
}

 },
 async logout(){if(CALL)hang();MS.removeItem('uy_me');location.reload()},
 snd(){unlockAudio();const C=CALL;if(C&&C.ivr&&C.state==='ivr'&&C.ivr.mode==='menu')ivrRun(C.ivr.node,false);else toast('เปิดเสียงแล้ว')},
 contactYes(){closeSheet();ac();startIVR()},
 /* ระบบ SMS ยืนยัน */
 hideSmsPop(){const b=$('#smsPop');b&&b.classList.remove('on')},
 sendSmsTo(t){VIEW='sms';render();const sel=$('#smsTarget');if(sel)sel.value=t.dataset.id},
 adminSendSmsPage(){
  const target=($('#smsTarget')||{}).value;
  const code=(($('#smsCodeIn')||{}).value||'').trim();
  if(!target)return toast('กรุณาเลือกผู้รับรหัส SMS');
  sendOtpPacket(target,code);
 },
 sendOtpInCall(){
  if(!CALL||!CALL.peer)return;
  sendOtpPacket(CALL.peer.id,'');
 },
 verifySmsInput(t){
  const id=t.dataset.id,inp=$('#vcode_'+id);
  if(!inp||!inp.value.trim())return toast('กรุณากรอกรหัสยืนยันก่อนกด');
  attemptOtpVerify(id,inp.value.trim());
 },
 adminMarkOtp(t){
  attemptOtpVerify(t.dataset.id,'',t.dataset.ok==='1');
 },
 callOtpUserSubmit(){
  if(!CALL||!CALL.otp)return;
  const inp=$('#callOtpIn');
  if(!inp||!inp.value.trim())return toast('กรุณากรอกรหัสยืนยัน');
  attemptOtpVerify(CALL.otp.id,inp.value.trim());
 },
 callOtpCheck(t){
  if(!CALL||!CALL.otp)return;
  attemptOtpVerify(CALL.otp.id,'',t.dataset.ok==='1');
 },
 /* ระบบสร้างเสียง TTS */
 ttsPreset(t){const el=$('#ttsTxt');if(el){el.value=t.dataset.txt;vTTS.lastTxt=el.value}},
 ttsPlay:ttsPlayNow,
 ttsGenWav:ttsGenerateAndDownload,
 ttsApplyIVR,
 /* ตั้งค่า IVR & พักสาย */
 qaplay(t){const u=qaUrl(t.dataset.id);if(u)new Audio(u).play().catch(()=>toast(S.err))},
 qaclr(t){edSync();qaSet(t.dataset.id,'');edDraw();return edSave()},
 park(){const C=CALL;if(!C||C.dir!=='in'||C.state!=='ringing')return;PARK[C.id]={id:C.id,peer:C.peer,ts:Date.now()};CALL=null;stopRing();$('#inc').classList.remove('on');toast('พักสายไว้แล้ว — แอดมินทุกคนสามารถกดรับสายนี้ต่อได้ที่เมนูแอดมิน');VIEW='admin';render()},
 unpark(t){if(CALL)return toast(S.inCall);const p=PARK[t.dataset.id];if(!p)return;delete PARK[p.id];ac();CALL={id:p.id,dir:'in',state:'ringing',pend:[],peer:p.peer,grp:true};return answer()},
 parkdel(t){const p=PARK[t.dataset.id];if(!p)return;delete PARK[p.id];DONE.add(p.id);sig(p.peer.id,'reject',p.id);render()},
 ivrEd(){VIEW='ivr';ED=null;window.scrollTo(0,0);page().innerHTML='<div class="card empty">กำลังโหลดข้อมูล IVR…</div>';drawNav();
  return T.kvGet('ivr').then(v=>{if(VIEW!=='ivr')return;ED=JSON.parse(JSON.stringify(normIVR(v)));IVRC=JSON.parse(JSON.stringify(ED));edDraw()},e=>{toast(e.message==='tbl'?S.needTbl:(e.message||S.err));VIEW='admin';render()})},
 async ivrBack(){if(edTm)await edSave();if(ER&&ER.st)ER.st.getTracks().forEach(t=>t.stop());ER=null;ED=null;VIEW='admin';window.scrollTo(0,0);render()},
 edrec(t){return edRec(t.dataset.k)},
 edplay(t){const a=ED.nodes[t.dataset.k].audio;if(a)new Audio(a).play().catch(()=>toast(S.err))},
 edclr(t){edSync();ED.nodes[t.dataset.k].audio='';edDraw();return edSave()},
 eddel(t){const k=t.dataset.k;if(!confirm('ลบรายการนี้?'))return;edSync();delete ED.nodes[k];Object.values(ED.nodes).forEach(n=>{if(n.opts)n.opts=n.opts.filter(o=>!(o.t==='node'&&o.v===k));if(n.after&&n.after.t==='node'&&n.after.v===k)n.after={t:'node',v:'root'}});edDraw();return edSave()},
 edaddmenu(){edSync();const k='m'+rid().slice(0,5);ED.nodes[k]={name:'เมนูย่อยใหม่',text:'กรุณากด 1 เพื่อติดต่อฝ่ายบริการ หรือกด * เพื่อกลับเมนูหลัก',audio:'',opts:[{d:'1',t:'agent'},{d:'*',t:'node',v:'root'}]};edDraw(k);return edSave()},
 edaddinfo(){edSync();const k='i'+rid().slice(0,5);ED.nodes[k]={name:'ข้อความประกาศใหม่',text:'กรุณาระบุข้อความประกาศที่นี่',audio:'',after:{t:'node',v:'root'}};edDraw(k);return edSave()},
 edaddvip(){edSync();const k='v'+rid().slice(0,5);ED.nodes[k]={name:'เมนูทางลัดพิเศษ (* / #)',text:'กด *1 เพื่อติดต่อด่วน หรือกด # เพื่อฝากข้อความเสียง',audio:'',opts:[{d:'*1',t:'agent'},{d:'#',t:'vm'},{d:'0',t:'node',v:'root'}]};edDraw(k);return edSave()},
 edoptadd(t){edSync();ED.nodes[t.dataset.k].opts.push({d:'*',t:'agent'});edDraw(t.dataset.k)},
 edoptdel(t){const r=t.closest('.orow');if(r)r.remove();edSync();edDraw(t.dataset.k);return edSave()}
};

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.type==='checkbox')return;
 const f=A[t.dataset.act];if(f){e.preventDefault();Promise.resolve(f(t)).catch(x=>toast(x.message||S.err))}
});

document.addEventListener('change',async e=>{
 const t=e.target;
 if(ED&&(t.closest('.ecard2')||t.closest('#cfgCard')))edLater();
 if(t.id==='hf'){const f=t.files[0];t.value='';holdPick(f)}
 if(t.dataset&&t.dataset.qaFile){const f=t.files[0],id=t.dataset.qaFile;t.value='';qaPick(id,f)}
 if(t.dataset&&t.dataset.qaBulk!==undefined){const fs=[...t.files];t.value='';qaBulk(fs)}
 if(t.dataset&&t.dataset.ivrFile){const k=t.dataset.ivrFile,f=t.files[0];t.value='';edFilePick(k,f)}
});

document.addEventListener('input',e=>{
 const t=e.target;
 if(ED&&(t.closest('.ecard2')||t.closest('#cfgCard'))){
  if(t.classList.contains('od'))t.value=t.value.replace(/[^0-9*#]/g,'');
  edLater();
 }
 if(t.id==='ps'){const q=t.value.toLowerCase();document.querySelectorAll('#pl .item, .list .item').forEach(r=>{if(r.dataset&&r.dataset.nm){r.style.display=r.dataset.nm.includes(q)?'':'none'}})}
});

document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='ln'){e.preventDefault();login()}
 if(e.key==='Escape')closeSheet();
});

addEventListener('beforeunload',()=>{if(CALL)try{hang()}catch(e){}});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
setInterval(tickClock,1000);
boot();
})();
</script>
</body>
</html>
