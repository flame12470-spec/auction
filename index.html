<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b6f51a">

<title>คุยกัน – แชต โทร และระบบตอบรับอัตโนมัติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --lime:#b6f51a;--lime-soft:#e8fca0;--green:#6fa300;--green-dark:#3f6200;
  --bg:#f7f7f7;--card:#fff;--text:#222;--muted:#777;--line:#e6e6e6;
  --shadow:0 4px 16px rgba(0,0,0,.06);--radius:20px;
  --red:#ffe1e1;--redInk:#b3261e;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;width:100%}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;background:#e9ecdf;color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;width:100%;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
img{display:block;max-width:100%}
.hide{display:none!important}
.sub{color:var(--muted);font-size:13px}
.in{color:#2e7d32}.out{color:#3f6200}.miss{color:#c62828}
bdi{unicode-bidi:isolate}

#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.08)}
#page{min-height:100vh;min-height:100dvh;padding-bottom:calc(104px + var(--sab))}
#page.noNav{padding-bottom:24px}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--sat)) 16px 8px}
.topbar h1{font-size:24px;flex:1;line-height:1.25;min-width:0}
.icon-btn{width:42px;height:42px;border-radius:14px;background:#efeff1;display:grid;place-items:center;font-size:20px;flex:none}
.icon-btn.call{background:var(--lime-soft)}
.brand-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--lime);margin-right:8px;box-shadow:0 0 0 3px var(--lime-soft)}
.pill{background:var(--lime-soft);color:var(--green-dark);padding:6px 14px;border-radius:99px;font-size:13px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#43d17a;display:inline-block;box-shadow:0 0 8px #43d17a;margin-right:6px}
.topsub{padding:0 16px 6px;color:var(--muted);font-size:14px}

/* banner */
.banner{margin:12px 16px;border-radius:var(--radius);min-height:128px;background:linear-gradient(120deg,#d9ff6a,#7de3b5 60%,#4cc9f0);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:block;width:calc(100% - 32px);text-align:left;color:#173300}
.banner small{font-size:13px;opacity:.85}
.banner h2{font-size:22px;line-height:1.25;margin:4px 0 6px;max-width:75%}
.banner .circle{position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.35)}
.banner .ph{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:26px;z-index:1;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.banner>*{position:relative;z-index:1}.banner .circle{z-index:0}

/* cards / lists */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 16px;padding:16px}
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 16px;margin:10px 16px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px dashed var(--line);text-align:left}
.item:last-child{border:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .end{text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.badge{background:var(--green);color:#fff;border-radius:99px;min-width:22px;padding:0 7px;font-size:12px;text-align:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none;position:relative}
.av.s{width:40px;height:40px;font-size:16px}
.dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:#43d17a;border:2px solid #fff}
.rb{width:40px;height:40px;border-radius:50%;background:#f1f6e3;font-size:18px;display:grid;place-items:center;flex:none}
.rb.call{background:var(--lime-soft)}
.section-title{padding:12px 20px 4px}.section-title h3{font-size:19px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.search{margin:6px 16px 4px;width:calc(100% - 32px);padding:13px 18px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:none;min-height:50px}
.search:focus,.fld input:focus{border-color:var(--green)}

/* buttons / forms */
.cta{display:block;width:calc(100% - 32px);margin:12px 16px;padding:16px;border-radius:16px;background:var(--lime);color:#222;font-size:18px;font-weight:700;transition:.15s;text-align:center}
.cta:active,.btn:active{transform:scale(.97)}
.cta.inline{width:100%;margin:16px 0 0}
.cta.ghost{background:#fff;border:2px solid var(--line)}
.cta.danger{background:#fff;color:#c62828;border:2px solid #f3c6c6}
.cta:disabled{opacity:.6}
.btn{padding:10px 18px;border-radius:99px;font-size:14px;background:#fff;border:2px solid var(--line)}
.btn.p{background:var(--lime);border-color:var(--lime);font-weight:600}
.btn.sm{padding:6px 14px;font-size:13px}
.fld label{font-size:14px;color:var(--muted);display:block;margin:12px 0 6px}
.fld input[type=text],.fld input[type=tel]{width:100%;padding:13px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:none;min-height:50px}
.chk{display:flex;gap:12px;align-items:center;font-size:15px;padding:6px 0}.chk input{width:26px;height:26px;accent-color:var(--green)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:14px 16px;line-height:1.7}
.hint.err{color:var(--redInk);background:var(--red);border-radius:14px;padding:12px}

/* auth */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(24px + var(--sat)) 16px 24px;background:linear-gradient(160deg,#f3ffd0 0,#f7f7f7 45%)}
.auth-card{width:100%;max-width:440px;background:var(--card);border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:28px 22px}
.logo{width:76px;height:76px;border-radius:24px;background:var(--lime);display:grid;place-items:center;font-size:38px;margin:0 auto 8px;box-shadow:0 0 0 6px var(--lime-soft)}
.auth-card h1{text-align:center;font-size:26px;margin-bottom:4px}
.auth-card .lead{text-align:center;color:var(--muted);font-size:14px;margin-bottom:6px;line-height:1.6}

/* bottom nav */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;height:calc(84px + var(--sab));background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-bottom:calc(10px + var(--sab));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#555;position:relative}
.tab svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--green);font-weight:700}
.tab .tb{position:absolute;top:-6px;right:calc(50% - 26px);background:#ff5a36;color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px;text-align:center}
.scan .bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.scan .bubble i{width:56px;height:56px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:#222}
.scan span.l{margin-top:38px}

/* chat page */
.chatpage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;flex-direction:column;background:#eef4dc;z-index:15}
.chatpage .topbar{background:#fff;padding-bottom:10px;box-shadow:0 1px 0 var(--line)}
.hn{flex:1;min-width:0}.hn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hn small{color:var(--muted);font-size:12px}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.b{max-width:80%;padding:8px 12px 4px;border-radius:16px;word-break:break-word;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.b.me{align-self:flex-end;background:var(--lime-soft);border-bottom-right-radius:4px}
.b.ot{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.b i{display:block;font-style:normal;font-size:10px;color:var(--muted);text-align:right;margin-top:2px}
.b .who{font-size:12px;color:var(--green);font-weight:700}
.b img{max-width:100%;max-height:300px;border-radius:10px;display:block;cursor:zoom-in;margin-bottom:2px}
.b audio{width:230px;max-width:100%;height:40px;margin:2px 0}
#comp{display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px + var(--sab));background:#fff;border-top:1px solid var(--line);flex:none}
#comp input[type=text]{flex:1;padding:12px 18px;border-radius:99px;border:2px solid var(--line);background:#fff;outline:none;min-width:0}
#comp input[type=text]:focus{border-color:var(--green)}
.cb2{width:44px;height:44px;border-radius:50%;background:var(--lime);color:#222;font-size:19px;display:grid;place-items:center;flex:none}
.cb2.g{background:#f1f6e3;color:var(--green-dark)}.cb2.r{background:#e53935;color:#fff}
.recbar{flex:1;display:flex;align-items:center;gap:10px;color:#e53935;font-weight:600}
.recbar .d{width:12px;height:12px;border-radius:50%;background:#e53935;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}

/* call overlays (อยู่นอก #page จึงไม่โดนวาดใหม่) */
.ov{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#1c3300,#3f6200);color:#fff;display:none;flex-direction:column;align-items:center;padding:calc(50px + var(--sat)) 20px calc(30px + var(--sab));overflow:auto;text-align:center}
.ov.on{display:flex}
.oi{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;flex:1}
.cav{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:700;margin-bottom:12px;box-shadow:0 0 0 10px rgba(255,255,255,.1)}
.ov h2{font-size:26px}.ov p.st{opacity:.85;margin-top:4px}
.sub2{margin:14px 0 0;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 14px;font-size:14px;min-height:44px;max-width:95%}
.extd{font-size:30px;letter-spacing:4px;min-height:44px;direction:ltr;margin-top:6px}
.cctl{display:flex;gap:26px;margin-top:auto;padding-top:20px;justify-content:center;align-items:center}
.cb{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:26px;display:grid;place-items:center}
.cb.on{background:#fff;color:var(--green-dark)}.cb.red{background:#e53935}.cb.grn{background:#2fb344}
.cb.red span{display:inline-block;transform:rotate(135deg)}
.kp{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center;margin-top:14px}
.kp button{height:56px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:24px}
.kp button:active{background:rgba(255,255,255,.35)}
.kp.lt button{background:#f1f6e3;color:var(--text)}.kp.lt button:active{background:var(--lime)}

/* sheet / toast */
#shBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;opacity:0;pointer-events:none;transition:.25s}
#shBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;background:#fff;border-radius:28px 28px 0 0;z-index:61;transform:translate(-50%,105%);transition:transform .3s;max-height:90vh;max-height:90dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 20px calc(24px + var(--sab))}
#sheet.on{transform:translate(-50%,0)}
#sheet .grab{width:48px;height:6px;border-radius:6px;background:#ddd;margin:0 auto 14px}
#sheet h3{font-size:20px;margin-bottom:8px}
.dn{direction:ltr;text-align:center;font-size:32px;min-height:50px;letter-spacing:3px}
.ecard{border:2px solid var(--line);border-radius:16px;padding:10px;margin-top:10px}
.ecard b{font-size:14px;color:var(--green-dark)}
.ecard textarea{width:100%;margin-top:6px;border:2px solid var(--line);border-radius:14px;padding:10px;min-height:76px;outline:none;line-height:1.6}
.erow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.erow button,.mini{background:#f1f6e3;color:var(--green-dark);border-radius:99px;padding:6px 14px;font-size:13px}
.mini.r{background:#ffe1e1;color:#b3261e}
.orow{display:flex;gap:6px;margin-top:6px;align-items:center}
.orow input{width:44px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:8px 0}
.orow select{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:8px;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(104px + var(--sab));transform:translate(-50%,20px);background:#222;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.lb{position:fixed;inset:0;background:#000e;z-index:70;display:grid;place-items:center}.lb img{max-width:100%;max-height:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

let AC=null;
const ac=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
function tone(fs,d,v){try{const c=ac(),g=c.createGain();g.gain.value=v||.15;g.connect(c.destination);fs.forEach(f=>{const o=c.createOscillator();o.frequency.value=f;o.connect(g);o.start();o.stop(c.currentTime+d)});setTimeout(()=>g.disconnect(),d*1000+60)}catch(e){}}
const DT={1:[697,1209],2:[697,1336],3:[697,1477],4:[770,1209],5:[770,1336],6:[770,1477],7:[852,1209],8:[852,1336],9:[852,1477],'*':[941,1209],0:[941,1336],'#':[941,1477]};
let ringT=null;
function ring(kind){stopRing();const inn=kind==='in';const go=()=>{if(inn){tone([440,480],.4);setTimeout(()=>tone([440,480],.4),600)}else tone([425],1)};go();ringT=setInterval(go,inn?3000:4000);if(inn&&navigator.vibrate)navigator.vibrate([400,200,400,1500,400,200,400])}
function stopRing(){clearInterval(ringT);ringT=null;if(navigator.vibrate)navigator.vibrate(0)}
function notifyB(t,b){try{if(document.hidden&&window.Notification&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}}

/* ============ Transport: ในเครื่อง (BroadcastChannel) / Supabase ============ */
function LocalT(){
 const bc=new BroadcastChannel('uy-app'),h={},pres={};let me=null,pcb=()=>{};
 const calc=()=>{const o={},n=Date.now();for(const k in pres)if(n-pres[k].ts<9000)o[k]=pres[k];pcb(o)};
 bc.onmessage=e=>{const d=e.data||{},p=d.p;if(d.ev==='_hi'){pres[p.id]=Object.assign({},p,{ts:Date.now()});calc()}else if(d.ev==='_bye'){delete pres[p.id];calc()}else(h[d.ev]||[]).forEach(f=>f(p))};
 return{
  async init(m){me=m;const hi=()=>bc.postMessage({ev:'_hi',p:me});hi();setInterval(hi,3000);setInterval(calc,3000);addEventListener('beforeunload',()=>bc.postMessage({ev:'_bye',p:{id:me.id}}))},
  track(m){me=m;bc.postMessage({ev:'_hi',p:me})},
  emit(ev,p){bc.postMessage({ev,p})},on(ev,f){(h[ev]=h[ev]||[]).push(f)},onPresence(f){pcb=f},
  async upsertUser(u){const a=LS('uy_users',{});for(const k in a)if(k!==u.id&&a[k].ext===u.ext)throw Error('dup');a[u.id]=u;SV('uy_users',a)},
  async users(){return Object.values(LS('uy_users',{}))},
  async saveMsg(m){const a=LS('uy_msgs',[]);a.push(m);if(!SV('uy_msgs',a)){a.splice(0,Math.ceil(a.length/3));SV('uy_msgs',a)}},
  async recent(id){return LS('uy_msgs',[]).filter(m=>m.chat==='inbox'||m.chat.split('|').includes(id))},
  upload(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)})},
  async kvGet(k){return LS('uy_kv_'+k,null)},async kvSet(k,v){SV('uy_kv_'+k,v)}
 }
}
function CloudT(){
 const sb=supabase.createClient(CFG.SB_URL,CFG.SB_KEY),h={};let ch,pcb=()=>{},me;
 const ck=r=>{if(r.error){const m=r.error.message||'';throw Error(r.error.code==='23505'?'dup':(r.error.code==='PGRST205'||r.error.code==='42P01'||/relation|does not exist|schema cache|Could not find the table/i.test(m)?'tbl':m))}return r.data};
 return{
  async init(m){me=m;ch=sb.channel('uy-room',{config:{presence:{key:m.id}}});
   ch.on('broadcast',{event:'*'},x=>(h[x.event]||[]).forEach(f=>f(x.payload)));
   ch.on('presence',{event:'sync'},()=>{const s=ch.presenceState(),o={};for(const k in s){const a=s[k];o[k]=a[a.length-1]}pcb(o)});
   await new Promise((res,rej)=>{const t=setTimeout(()=>rej(Error('เชื่อมต่อเรียลไทม์ไม่สำเร็จ')),12000);ch.subscribe(s=>{if(s==='SUBSCRIBED'){clearTimeout(t);ch.track(m);res()}})})},
  track(m){me=m;ch.track(m)},
  emit(ev,p){ch.send({type:'broadcast',event:ev,payload:p})},on(ev,f){(h[ev]=h[ev]||[]).push(f)},onPresence(f){pcb=f},
  async upsertUser(u){ck(await sb.from('uy_users').upsert({id:u.id,name:u.name,ext:u.ext,agent:!!u.agent}))},
  async users(){return ck(await sb.from('uy_users').select('*'))},
  async saveMsg(m){ck(await sb.from('uy_msgs').insert(m))},
  async recent(id){const r=ck(await sb.from('uy_msgs').select('*').or('chat.like.*'+id+'*,chat.eq.inbox').order('ts',{ascending:false}).limit(400));return r.reverse()},
  async upload(blob,ext){const p=me.id+'/'+rid()+'.'+ext;const r=await sb.storage.from('uy-media').upload(p,blob,{contentType:blob.type});if(r.error)throw r.error;return sb.storage.from('uy-media').getPublicUrl(p).data.publicUrl},
  async kvGet(k){const r=await sb.from('uy_kv').select('v').eq('k',k).maybeSingle();return r.data?r.data.v:null},
  async kvSet(k,v){ck(await sb.from('uy_kv').upsert({k,v}))}
 }
}

/* ============ เริ่มต้น / สมัคร-เข้าสู่ระบบ ============ */
function mkT(){try{return CLOUD?CloudT():LocalT()}catch(e){return LocalT()}}

function loginView(msg){

 page().innerHTML='<div class="auth"><div class="auth-card"><div class="logo">📞</div><h1>'+S.loginTitle+'</h1><p class="lead">'+S.loginLead+'</p>'+
 '<div class="fld"><label for="ln">'+S.name+'</label><input type="text" id="ln" autocomplete="name" maxlength="40" placeholder="เช่น สมชาย ใจดี"></div>'+
 '<button class="cta inline" id="lb" data-act="login">'+S.login+'</button>'+
 (msg?'<p class="hint err">'+msg+'</p>':'')+
 (msg&&msg===S.needTbl?'<button class="cta inline ghost" data-act="useLocal">'+S.useLocal+'</button>':'')+
 '<p class="hint">'+S.loginHint+'<br>'+(CLOUD?S.netOn:S.netOff)+'</p></div></div>';

async function login(){
 const inp=$('#ln'),n=inp.value.trim().replace(/\s+/g,' ');
 if(!n)return toast(S.enterName);
 const b=$('#lb');b.disabled=true;b.textContent='กำลังเข้าสู่ระบบ…';
 ac();try{window.Notification&&Notification.requestPermission()}catch(x){}
 let us=[];
 try{us=await T.users()}catch(e){return loginView(e.message==='tbl'?S.needTbl:S.err+': '+esc(e.message))}
 const ex=us.find(u=>String(u.name).trim().toLowerCase()===n.toLowerCase());
 let me;
 if(ex)me={id:ex.id,name:ex.name,ext:ex.ext,agent:!!ex.agent};
 else{let e;do{e=String(1000+Math.floor(Math.random()*9000))}while(us.some(u=>u.ext===e));me={id:rid(),name:n,ext:e,agent:false}}
 await enter(me);
}
async function enter(me,silent){
 ME=me;
 try{
  await T.upsertUser(pub(ME));
  await T.init(pub(ME));
 }catch(e){
  ME=null;T=mkT();MS.removeItem('uy_me');
  if(silent)return false;
  loginView(e.message==='tbl'?S.needTbl:(e.message==='dup'?'เบอร์ซ้ำ ลองเข้าสู่ระบบใหม่':S.err+': '+esc(e.message)));return false;
 }
 MS.setItem('uy_me',JSON.stringify(pub(ME)));
 T.on('msg',onMsg);T.on('sig',onSig);
 T.onPresence(o=>{ONL=o;const k=Object.values(o).map(x=>x.id+'|'+x.name+'|'+!!x.agent).sort().join();if(k!==lastPres){lastPres=k;render()}});
 await refresh();setInterval(refreshUsers,30000);
 $('#nav').classList.remove('hide');VIEW='chats';render();
 return true;
}
async function refreshUsers(){try{const us=await T.users();const k=JSON.stringify(us.map(u=>[u.id,u.name,u.ext,!!u.agent]).sort());us.forEach(u=>USERS[u.id]=u);if(k!==lastUsers){lastUsers=k;render()}}catch(e){}}
async function refresh(){
 try{const us=await T.users();us.forEach(u=>USERS[u.id]=u);lastUsers=JSON.stringify(us.map(u=>[u.id,u.name,u.ext,!!u.agent]).sort());
  const r=await T.recent(ME.id);MSGS={};r.forEach(m=>{if(m.chat!=='inbox'||ME.agent)addMsg(m)})}
 catch(e){toast(e.message==='tbl'?S.needTbl:e.message)}
}

/* ============ ข้อความ ============ */
function addMsg(m){const a=MSGS[m.chat]=MSGS[m.chat]||[];if(a.some(x=>x.id===m.id))return false;a.push(m);a.sort((x,y)=>x.ts-y.ts);return true}
async function sendMsg(chat,kind,f){
 const m=Object.assign({id:rid(),chat,sender:ME.id,kind,body:'',url:'',dur:0,ts:Date.now()},f||{});
 addMsg(m);render();
 try{await T.saveMsg(m)}catch(e){toast(e.message==='tbl'?S.needTbl:e.message);return}
 T.emit('msg',m);
}
function onMsg(m){
 const rel=m.chat==='inbox'?ME.agent:m.chat.split('|').includes(ME.id);if(!rel||m.sender===ME.id)return;
 if(!addMsg(m))return;
 if(!USERS[m.sender])refreshUsers();
 if(OPEN===m.chat&&!document.hidden){READ[m.chat]=m.ts;SV('uy_read',READ)}
 const u=getUser(m.sender)||{name:'?'};notifyB(u.name,m.kind==='text'?m.body:(m.kind==='image'?'📷':'🎤'));
 tone([880],.08,.06);render();
}
const unread=c=>(MSGS[c]||[]).filter(m=>m.sender!==ME.id&&m.ts>(READ[c]||0)).length;
const prev=m=>m?(m.kind==='image'?'📷 '+S.photo:m.kind==='voice'?'🎤 '+S.voice:m.body):'';

/* ============ ภาพ / เสียง ============ */
function shrink(file,max){max=max||1024;return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(Error('img')),'image/jpeg',.78);URL.revokeObjectURL(i.src)};i.onerror=()=>rej(Error('img'));i.src=URL.createObjectURL(file)})}
function recorder(stream){
 const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
 const mr=new MediaRecorder(stream,mt?{mimeType:mt}:{}),ch=[],t0=Date.now();
 mr.ondataavailable=e=>e.data&&e.data.size&&ch.push(e.data);mr.start();
 return{ext:/mp4/.test(mt)?'m4a':'webm',stop:()=>new Promise(r=>{if(mr.state==='inactive')return r({blob:new Blob(ch),dur:0});mr.onstop=()=>r({blob:new Blob(ch,{type:mr.mimeType||'audio/webm'}),dur:Math.round((Date.now()-t0)/1000)});mr.stop()})}
}
async function pickImage(f){
 if(!f||!OPEN)return;
 try{const b=await shrink(f);const url=await T.upload(b,'jpg');sendMsg(OPEN,'image',{url})}catch(e){toast(S.err)}
}
async function recStart(){
 try{const st=await getMic();REC={st,rec:recorder(st),t0:Date.now()};
  REC.tm=setInterval(()=>{const e=$('#rt');if(e)e.textContent=mmss(Math.round((Date.now()-REC.t0)/1000))},500);comp()}
 catch(e){toast(S.noMic)}
}
async function recEnd(send){
 const R=REC;if(!R)return;REC=null;clearInterval(R.tm);
 const r=await R.rec.stop();R.st.getTracks().forEach(t=>t.stop());comp();
 if(send&&r.dur>=1){try{const url=await T.upload(r.blob,R.rec.ext);sendMsg(OPEN,'voice',{url,dur:r.dur})}catch(e){toast(S.err)}}
}

/* ============ โทร (WebRTC) ============ */
const sig=(to,type,callId,x)=>T.emit('sig',Object.assign({to,from:ME.id,type,callId},x||{}));
async function startCall(u){
 if(CALL)return toast(S.inCall);
 if(!ONL[u.id])return toast(S.offline);
 ac();CALL={id:rid(),dir:'out',pend:[],state:'calling',peer:u};
 callUI();                               // แสดงหน้าจอโทรทันที ก่อนขอไมค์
 await beginOut(u);
}
async function beginOut(u){
 const C=CALL;
 try{C.stream=C.stream||await getMic()}catch(e){return cleanup(S.noMic)}
 if(CALL!==C)return;
 C.peer=u;C.state='calling';C.invited=[u.id];C.pend=[];C.ivr=null;C.sub='';
 sig(u.id,'invite',C.id,{name:ME.name,ext:ME.ext});ring('out');callUI();
 C.to=setTimeout(()=>{if(CALL===C&&C.state==='calling'){C.invited.forEach(i=>sig(i,'cancel',C.id));cleanup(S.noAns)}},40000);
}
async function mkPC(){
 const C=CALL,pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});
 C.pc=pc;C.stream.getTracks().forEach(t=>pc.addTrack(t,C.stream));
 pc.onicecandidate=e=>{if(e.candidate)sig(C.peer.id,'ice',C.id,{c:e.candidate})};
 pc.ontrack=e=>{const a=$('#ra');a.srcObject=e.streams[0];a.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(CALL!==C)return;if(pc.connectionState==='connected')connected();if(pc.connectionState==='failed')cleanup(S.failed)};
}
function connected(){const C=CALL;if(!C||C.state==='connected')return;clearTimeout(C.to);C.state='connected';C.t0=Date.now();stopRing();callUI()}
async function flush(C){while(C.pend.length)try{await C.pc.addIceCandidate(C.pend.shift())}catch(e){}}
async function onSig(p){
 if(p.to!==ME.id)return;
 let C=CALL;
 if(p.type==='invite'){
  if(C)return sig(p.from,'busy',p.callId);
  CALL=C={id:p.callId,dir:'in',state:'ringing',pend:[],peer:getUser(p.from)||{id:p.from,name:p.name||'?',ext:p.ext},grp:!!p.grp};
  ring('in');incUI();notifyB(S.incoming,C.peer.name);return;
 }
 if(!C||p.callId!==C.id)return;
 try{switch(p.type){
  case 'accept':
   if(C.dir==='out'&&(C.state==='calling'||C.state==='agentring')){
    clearTimeout(C.to);stopRing();stopPrompt();
    (C.invited||[]).filter(i=>i!==p.from).forEach(i=>sig(i,'cancel',C.id));
    C.peer=getUser(p.from)||C.peer;C.ivr&&(C.ivr.tok++);C.ivr=null;C.state='connecting';
    try{C.stream=C.stream||await getMic()}catch(e){sig(p.from,'hangup',C.id);return cleanup(S.noMic)}
    callUI();await mkPC();const o=await C.pc.createOffer();await C.pc.setLocalDescription(o);sig(p.from,'offer',C.id,{sdp:o});
   }else sig(p.from,'hangup',C.id);break;
  case 'reject':case 'busy':
   C.invited=(C.invited||[]).filter(i=>i!==p.from);
   if(!C.invited.length){if(C.state==='agentring')ivrNoAgent();else if(C.state==='calling')cleanup(p.type==='busy'?S.busy:S.rejected)}break;
  case 'cancel':if(C.dir==='in'&&C.state==='ringing'){C.missed=1;cleanup()}break;
  case 'offer':await C.pc.setRemoteDescription(p.sdp);await flush(C);const a=await C.pc.createAnswer();await C.pc.setLocalDescription(a);sig(C.peer.id,'answer',C.id,{sdp:a});break;
  case 'answer':await C.pc.setRemoteDescription(p.sdp);await flush(C);break;
  case 'ice':if(C.pc&&C.pc.remoteDescription)C.pc.addIceCandidate(p.c).catch(()=>{});else C.pend.push(p.c);break;
  case 'hangup':cleanup(S.ended);break;
 }}catch(e){console.error(e)}
}
async function answer(){
 const C=CALL;if(!C||C.state!=='ringing')return;stopRing();ac();
 try{C.stream=await getMic()}catch(e){sig(C.peer.id,'reject',C.id);return cleanup(S.noMic)}
 C.state='connecting';callUI();await mkPC();sig(C.peer.id,'accept',C.id);
 C.to=setTimeout(()=>{if(CALL===C&&C.state==='connecting')cleanup(S.failed)},20000);
}
function decline(){const C=CALL;if(!C)return;sig(C.peer.id,'reject',C.id);C.rejected=1;cleanup()}
function hang(){
 const C=CALL;if(!C)return;
 if(C.dir==='in'&&C.state==='ringing')sig(C.peer.id,'reject',C.id);
 else if(C.state==='calling'||C.state==='agentring')(C.invited||[]).forEach(i=>sig(i,'cancel',C.id));
 else if(C.state!=='ivr'&&C.peer.id!=='ivr')sig(C.peer.id,'hangup',C.id);
 cleanup(S.ended);
}
function cleanup(msg){
 const C=CALL;if(!C)return;CALL=null;
 stopRing();clearInterval(C.tm);clearTimeout(C.to);
 if(C.ivr){const I=C.ivr;clearTimeout(I.tmo);clearTimeout(I.vmT);I.tok++;I.cancel&&I.cancel();I.rec&&I.rec.stop().catch(()=>{})}
 try{C.pc&&C.pc.close()}catch(e){}
 C.stream&&C.stream.getTracks().forEach(t=>t.stop());
 const ra=$('#ra');ra&&(ra.srcObject=null);
 const res=C.t0&&C.peer.id!=='ivr'?'ok':(C.peer.id==='ivr'?'ivr':(C.dir==='in'?(C.rejected?'rej':'missed'):'no'));
 const l=CL();l.unshift({pid:C.peer.id,name:C.peer.name,ext:C.peer.ext,dir:C.dir,ts:Date.now(),dur:C.t0?Math.round((Date.now()-C.t0)/1000):0,res});SV('uy_calls_'+ME.id,l.slice(0,80));
 ['#call','#inc'].forEach(s=>{const e=$(s);e&&e.classList.remove('on')});
 if(msg)toast(msg);render();
}
const stTxt=C=>C.state==='calling'?S.calling:C.state==='agentring'?S.toAgent:C.state==='connecting'?S.connecting:(C.state==='ivr'||C.state==='connected')&&C.t0?mmss(Math.round((Date.now()-C.t0)/1000)):S.ivrOn;
function incUI(){

 clearInterval(C.tm);C.tm=setInterval(()=>{const s=$('#cst');if(s&&CALL===C&&(C.state==='connected'||C.state==='ivr'))s.textContent=stTxt(C)},1000);
 e.innerHTML='<div class="oi"><div class="cav" style="background:'+(ivr?'#ffffff33':col(C.peer.id))+'">'+(ivr?'☎':esc(ini(C.peer.name)))+'</div><h2>'+esc(C.peer.name)+'</h2><p class="st" id="cst">'+stTxt(C)+'</p>'+
  (ivr||C.ivrMode?'<div class="sub2" id="sub">'+esc(C.sub||'')+'</div><div class="extd" id="ext">'+esc(C.ivr&&C.ivr.buf||'')+'</div>':'')+
  (ivr?kpHtml('dg'):'')+
  '<div class="cctl">'+(!ivr&&C.state!=='calling'&&C.state!=='agentring'?'<button class="cb '+(C.muted?'on':'')+'" data-act="mute">'+(C.muted?'🔇':'🎙')+'</button>':'')+'<button class="cb red" data-act="hang"><span>📞</span></button></div></div>';
 e.classList.add('on');

/* ============ IVR (ระบบตอบรับอัตโนมัติ) ============ */
const ttsVoice=()=>{try{return speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang))}catch(e){return null}};
function stopPrompt(){const C=CALL;if(C&&C.ivr&&C.ivr.cancel)C.ivr.cancel();try{speechSynthesis.cancel()}catch(e){}}
function say(key){return new Promise(res=>{
 const C=CALL,I=C&&C.ivr;if(!I)return res();
 const n=IVRC.nodes[key]||{text:'',audio:''};I.cancel&&I.cancel();
 C.sub=n.text;const s=$('#sub');if(s)s.textContent=n.text;
 let done=false;const fin=()=>{if(done)return;done=true;I.cancel=null;res()};
 if(n.audio){const a=new Audio(n.audio);I.cancel=()=>{a.pause();fin()};a.onended=fin;a.onerror=fin;a.play().catch(fin)}
 else if(window.speechSynthesis&&ttsVoice()){const v=ttsVoice(),u=new SpeechSynthesisUtterance(n.text);u.voice=v;u.lang=v.lang;u.onend=u.onerror=fin;I.cancel=()=>{speechSynthesis.cancel();fin()};speechSynthesis.speak(u)}
 else{const t=setTimeout(fin,Math.min(9000,1500+n.text.length*55));I.cancel=()=>{clearTimeout(t);fin()}}
})}
async function startIVR(){
 if(CALL)return toast(S.inCall);
 ac();try{IVRC=(await T.kvGet('ivr'))||defIVR()}catch(e){IVRC=defIVR()}
 CALL={id:rid(),dir:'out',state:'ivr',pend:[],t0:Date.now(),peer:{id:'ivr',name:S.operator,ext:OPERATOR_EXT},ivr:{tok:0,idle:0,buf:'',mode:'menu',node:'root'}};
 tone([480,620],.3,.1);callUI();ivrRun('root');
}
async function ivrRun(key){
 const C=CALL;if(!C||C.state!=='ivr'||!C.ivr)return;const I=C.ivr,tok=++I.tok;I.node=key;I.mode='menu';I.buf='';updExt();clearTimeout(I.tmo);
 await say(key);if(CALL!==C||I.tok!==tok)return;
 const n=IVRC.nodes[key]||{};
 if(n.after)return ivrAct(n.after);
 if(!n.opts||!n.opts.length)return ivrAct({t:'node',v:'root'});
 I.tmo=setTimeout(()=>{if(CALL!==C||I.tok!==tok)return;if(++I.idle>=2){say('thx').then(()=>CALL===C&&cleanup(S.ended))}else ivrRun(key)},8000);
}
async function ivrAct(a){
 const C=CALL;if(!C||!C.ivr)return;const I=C.ivr;
 if(a.t==='node')return ivrRun(a.v);
 if(a.t==='repeat')return ivrRun(I.node);
 if(a.t==='vm')return ivrVM();
 if(a.t==='agent')return ivrAgent();
 if(a.t==='hang'){++I.tok;await say('thx');if(CALL===C)cleanup(S.ended);return}
 if(a.t==='ext'){const k=++I.tok;I.mode='ext';I.buf='';updExt();await say('extp');if(CALL!==C||I.tok!==k)return;I.tmo=setTimeout(()=>{if(CALL===C&&I.mode==='ext'&&!I.buf)ivrRun('root')},12000)}
}
function dig(d){
 tone(DT[d],.12,.1);
 const C=CALL;if(!C||C.state!=='ivr'||!C.ivr)return;
 const I=C.ivr;clearTimeout(I.tmo);
 if(I.mode==='vm'){if(d==='#')ivrVMEnd();return}
 if(I.mode==='ext'){
  I.cancel&&I.cancel();
  if(d==='#')return ivrDial();if(d==='*'){I.buf='';updExt();return}
  I.buf+=d;updExt();I.tmo=setTimeout(ivrDial,4000);return;
 }
 I.tok++;I.cancel&&I.cancel();
 const o=((IVRC.nodes[I.node]||{}).opts||[]).find(x=>x.d===d);
 if(o)ivrAct(o);else say('bad').then(()=>CALL===C&&ivrRun(I.node));
}
async function ivrDial(){
 const C=CALL;if(!C||!C.ivr)return;const I=C.ivr;clearTimeout(I.tmo);const ext=I.buf;I.buf='';updExt();if(!ext)return;
 const u=Object.values(allUsers()).find(x=>x.ext===ext&&x.id!==ME.id);
 if(!u||!ONL[u.id]){I.tok++;await say('bad');if(CALL===C)ivrRun('root');return}
 I.tok++;I.cancel&&I.cancel();await beginOut(u);
}
async function ivrAgent(){
 const C=CALL;if(!C||!C.ivr)return;const I=C.ivr;const k=++I.tok;
 const ag=Object.values(ONL).filter(x=>x.agent&&x.id!==ME.id);
 if(!ag.length){await say('noagent');if(CALL===C&&I.tok===k)ivrVM();return}
 await say('agent');if(CALL!==C||I.tok!==k)return;
 C.state='agentring';C.invited=ag.map(x=>x.id);C.ivrMode=1;callUI();ring('out');
 ag.forEach(x=>sig(x.id,'invite',C.id,{name:ME.name,ext:ME.ext,grp:1}));
 C.to=setTimeout(()=>{if(CALL===C&&C.state==='agentring'){C.invited.forEach(i=>sig(i,'cancel',C.id));ivrNoAgent()}},30000);
}
async function ivrNoAgent(){
 const C=CALL;if(!C||!C.ivr)return;stopRing();clearTimeout(C.to);C.state='ivr';C.invited=[];callUI();
 const k=++C.ivr.tok;await say('noagent');if(CALL===C&&C.ivr.tok===k)ivrVM();
}
async function ivrVM(){
 const C=CALL;if(!C||!C.ivr)return;const I=C.ivr;const k=++I.tok;I.mode='vm';
 await say('vmp');if(CALL!==C||I.tok!==k)return;
 try{C.stream=C.stream||await getMic()}catch(e){await say('bad');return cleanup(S.noMic)}
 tone([1000],.35,.15);I.rec=recorder(C.stream);C.sub=S.vmRec;const s=$('#sub');if(s)s.textContent=S.vmRec;
 I.vmT=setTimeout(ivrVMEnd,60000);
}
async function ivrVMEnd(){
 const C=CALL;if(!C||!C.ivr||!C.ivr.rec)return;const I=C.ivr;clearTimeout(I.vmT);const R=I.rec;I.rec=null;I.mode='done';
 const r=await R.stop();
 if(r.dur>=1){try{const url=await T.upload(r.blob,R.ext);const m={id:rid(),chat:'inbox',sender:ME.id,kind:'voice',body:ME.name+' (เบอร์ '+ME.ext+')',url,dur:r.dur,ts:Date.now()};await T.saveMsg(m);T.emit('msg',m)}catch(e){toast(S.err)}}
 if(CALL===C){await say('thx');if(CALL===C)cleanup(S.ended)}
}

function edDraw(){
 sheet('<h3>'+S.ivrSet+'</h3>'+Object.keys(ED.nodes).map(k=>{const n=ED.nodes[k];
  return '<div class="ecard" data-k="'+k+'"><b>'+esc(NL[k]||S.extra)+'</b><textarea class="et">'+esc(n.text)+'</textarea><div class="erow"><button data-act="edrec" data-k="'+k+'">'+(ER&&ER.k===k?'⏹':'🎙')+' '+S.rec+'</button>'+(n.audio?'<button data-act="edplay" data-k="'+k+'">▶</button><button class="mini r" data-act="edclr" data-k="'+k+'">✕</button>':'')+(NL[k]?'':'<button class="mini r" data-act="eddel" data-k="'+k+'">'+S.del+'</button>')+'</div>'+(n.opts?optsHtml(k,n):'')+'</div>'}).join('')+
  '<button class="cta inline ghost" data-act="edadd">'+S.addNode+'</button><button class="cta inline" data-act="edsave">'+S.save+'</button>');
}
async function edRec(k){
 edSync();
 if(ER&&ER.k===k){const R=ER;ER=null;const r=await R.rec.stop();R.st.getTracks().forEach(t=>t.stop());try{ED.nodes[k].audio=await T.upload(r.blob,R.rec.ext)}catch(e){toast(S.err)}return edDraw()}
 try{const st=await getMic();ER={k,st,rec:recorder(st)};edDraw()}catch(e){toast(S.noMic)}
}

/* ============ เหตุการณ์ ============ */
const A={
 login,
 useLocal(){CFG.local=true;SV('uy_cfg',{local:true});location.reload()},
 useCloud(){try{localStorage.removeItem('uy_cfg')}catch(e){}location.reload()},
 tab(t){VIEW=t.dataset.v;window.scrollTo(0,0);render()},
 open(t){openChat(t.dataset.c)},
 chat(t){openChat(cid(ME.id,t.dataset.id))},
 back(){recEnd(false);OPEN=null;render()},
 callu(t){const u=getUser(t.dataset.id);if(u)startCall(u)},
 callx(t){const u=getUser(t.dataset.id);if(u)startCall(u);else toast(S.offline)},
 ivr:startIVR,
 sendT:sendText,recStart,recCancel(){recEnd(false)},recSend(){recEnd(true)},
 zoom(t){const m=(MSGS[OPEN]||[]).find(x=>x.id===t.dataset.i);if(!m)return;const d=document.createElement('div');d.className='lb';d.innerHTML='<img src="'+esc(m.url)+'">';d.onclick=()=>d.remove();document.body.appendChild(d)},
 answer,decline,hang,mute,dg(t){dig(t.dataset.d)},
 dialer,dk(t){if(DIAL.length<8){DIAL+=t.dataset.d;$('#dn').textContent=DIAL;tone(DT[t.dataset.d],.1,.08)}},dbs(){DIAL=DIAL.slice(0,-1);$('#dn').innerHTML=DIAL||'&nbsp;'},dgo:dialGo,
 closeSheet,
 async logout(){if(CALL)hang();MS.removeItem('uy_me');location.reload()},
 ivrEd(){ED=JSON.parse(JSON.stringify(IVRC));T.kvGet('ivr').then(v=>{if(v){ED=JSON.parse(JSON.stringify(v));IVRC=v;edDraw()}}).catch(()=>{});edDraw()},
 edrec(t){edRec(t.dataset.k)},
 edplay(t){const a=ED.nodes[t.dataset.k].audio;if(a)new Audio(a).play().catch(()=>{})},
 edclr(t){edSync();ED.nodes[t.dataset.k].audio='';edDraw()},
 eddel(t){edSync();delete ED.nodes[t.dataset.k];ED.nodes.root.opts=ED.nodes.root.opts.filter(o=>!(o.t==='node'&&o.v===t.dataset.k));edDraw()},
 edadd(){edSync();ED.nodes['n'+rid().slice(0,5)]={text:'',audio:'',after:{t:'node',v:'root'}};edDraw()},
 edoptadd(t){edSync();ED.nodes[t.dataset.k].opts.push({d:'',t:'agent'});edDraw()},
 edoptdel(t){edSync();ED.nodes[t.dataset.k].opts.splice(+t.dataset.i,1);edDraw()},
 async edsave(){edSync();try{await T.kvSet('ivr',ED);IVRC=JSON.parse(JSON.stringify(ED));closeSheet();toast(S.saved)}catch(e){toast(e.message==='tbl'?S.needTbl:e.message)}}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.type==='checkbox')return;
 const f=A[t.dataset.act];if(f){e.preventDefault();Promise.resolve(f(t)).catch(x=>toast(x.message||S.err))}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='pf'){const f=t.files[0];t.value='';pickImage(f)}
 if(t.dataset&&t.dataset.act==='agentTg'){ME.agent=t.checked;MS.setItem('uy_me',JSON.stringify(pub(ME)));try{await T.upsertUser(pub(ME));T.track(pub(ME))}catch(x){toast(x.message)}if(ME.agent)refresh();render()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='mi'){const has=!!t.value.trim();$('#bs').style.display=has?'':'none';$('#bm').style.display=has?'none':''}
 if(t.id==='ps'){const q=t.value.toLowerCase();document.querySelectorAll('#pl .item').forEach(r=>r.style.display=r.dataset.nm.includes(q)?'':'none')}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='mi'){e.preventDefault();sendText()}
 if(e.key==='Enter'&&e.target.id==='ln'){e.preventDefault();login()}
 if(e.key==='Escape')closeSheet();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&OPEN){READ[OPEN]=Date.now();SV('uy_read',READ);render()}});
addEventListener('beforeunload',()=>{if(CALL)try{hang()}catch(e){}});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
boot();
})();
</script>
